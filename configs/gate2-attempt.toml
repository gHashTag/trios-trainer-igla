# Gate-2 attempt — push beyond champion with HybridAttn (L-h2).
# Goal: BPB < 2.22 first, then < 1.50 across 3 seeds.
# Attempt-2 fleet (after attempt-1 on 43/44/45 yielded 0 rows < 1.85): 100/101/102.

name         = "gate2-attempt"
steps        = 30_000
seed         = 100          # override per worker via TRIOS_SEED (100/101/102 fleet)
target_bpb   = 1.50
champion_bpb = 2.2393

[model]
d_model     = 384
n_layers    = 4
n_heads     = 6
vocab_size  = 32_000
seq_len     = 1024
hybrid_attn = true

[optimizer]
# NOT IMPLEMENTED. "muon+adamw" is not in train_loop::SUPPORTED_OPTIMIZERS
# {adamw, muon, muon-cwd}; there is no mixed Muon+AdamW loop in this crate.
# `--config` used to run plain AdamW under this declaration and record the run
# as `adamw` in the sidecar. It now REFUSES (train_loop::unhonoured_fields), as
# do the [model] geometry and the objective weights below. The declaration is
# left standing on purpose: rewriting it to "adamw" would make the file lie
# about what this experiment was meant to be.
kind         = "muon+adamw"
lr           = 0.004
beta1        = 0.9
beta2        = 0.95
weight_decay = 0.04
schedule     = "phi"
warmup_steps = 1_000

[data]
corpus       = "fineweb"
train_path   = "/data/fineweb_train.bin"
val_path     = "/data/fineweb_val.bin"
batch_size   = 8
batch_tokens = 524_288

[objective]
w_ce   = 1.0
w_jepa = 0.5
w_nca  = 0.1

[ledger]
# Was "assertions/seed_results.jsonl" with push = true, i.e. running this file
# committed and pushed to origin as a side effect of measuring a BPB. That
# ledger is retracted (renamed to assertions/RETRACTED-seed_results.jsonl.txt);
# re-creating the path republishes retracted evidence, and
# `falsify_live_ledger_resurrected` in tests/preregistration_seed_lock.rs fails
# if it reappears. An empty path makes run() skip the emit entirely: this
# config cannot mint a row, and it cannot touch git.
jsonl_path   = ""
push         = false
embargo_path = ".embargo"
