name: Format-Algo Matrix (312 cells - trios#446)
# Phase C lane L-C4 + L-C5: fan-out (Format x Algorithm) cells over GitHub
# Actions matrix runners and stream bpb_samples rows into ssot.bpb_samples.
# This is the workaround for trios-railway#61 (6-account Railway auth stalled):
# GHA matrix runners replace the blocked Railway fan-out until multi-account
# auth is unblocked.
#
# Anti-fake-pass guard (L-C4): for EVERY eligible non-baseline cell, the final
# bpb must differ from the f32+adamw baseline at the same (hidden, seed) by at
# least 1e-6. This catches "silent f32 fallback" bugs where a FakeQuant kernel
# no-ops. Between 2026-05 and 2026-08-03 the guard passed if any ONE cell
# diverged, which certified nothing; it was restored to per-cell on 2026-08-03
# together with the checksum-pinned corpus step that makes the numbers it
# reads actual measurements.
#
# Triggers:
#   * workflow_dispatch - manual sweep with custom formats/algos inputs.
#   * schedule (nightly 03:17 UTC) - incremental autonomous fill of the matrix.
#   * push on paths that touch the runner binary or kernel implementations,
#     restricted to a 4-cell smoke sample so PRs stay fast (<15 min).
#
# Anchor: phi^2 + phi^-2 = 3.

on:
  workflow_dispatch:
    inputs:
      formats:
        description: "Comma-separated TRIOS_FORMAT_TYPE values (real kernels only: fp32 fp16 bf16 fp8_e4m3 fp8_e5m2 gf16 int8 int4 nf4 posit16 fp80)"
        required: false
        default: "fp32,gf16,bf16,fp16,fp8_e4m3,fp8_e5m2,int8,int4,nf4,posit16,fp80"
      algos:
        description: "Comma-separated TRIOS_ALGO_TYPE values (whitelist: adamw, muon) - R5: trios-trainer-igla#140 ALGO_WHITELIST. NOTE: muon-cwd removed 2026-05-14 until cpu_train.rs implements it (#146)."
        required: false
        default: "adamw,muon"
      seeds:
        description: "Comma-separated seeds (Fibonacci/Lucas canon - FORBIDDEN: 42 43 44 45)"
        required: false
        default: "47,89,144,1597,2584"
      hidden:
        description: "Comma-separated hidden sizes (3D matrix sweep: Format x Algo x Hidden)"
        required: false
        default: "64,128,256"
      lr:
        description: "Comma-separated learning rates"
        required: false
        default: "0.001,0.0001"
      steps:
        description: "Training steps per cell"
        required: false
        default: "3000"
      lane:
        description: "LANE token for canon_name (e.g. SHORT-WAVE-MATRIX, MATRIX, COVERAGE-A)"
        required: false
        default: "MATRIX"
  schedule:
    # Daily nightly sweep, 03:17 UTC - off-peak for GHA quota.
    - cron: "17 3 * * *"
  pull_request:
    branches: [main]
    paths:
      - "src/bin/matrix_runner.rs"
      - "src/fake_quant.rs"
      - "src/bin/cpu_train.rs"
      - ".github/workflows/format-algo-matrix.yml"

concurrency:
  # Parallel workflow_dispatch sweeps must NOT cancel each other (we fan out
  # 312 cells over multiple waves to stay under the per-account GHA queue
  # quota). Per-run-id grouping lets each manual dispatch keep its slot.
  # Schedule + pull_request still serialize on workflow+ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'shared' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan cells
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.build-plan.outputs.cells }}
    steps:
      - id: build-plan
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              FORMATS="${{ github.event.inputs.formats }}"
              ALGOS="${{ github.event.inputs.algos }}"
              SEEDS="${{ github.event.inputs.seeds }}"
              HIDDEN="${{ github.event.inputs.hidden }}"
              LR="${{ github.event.inputs.lr }}"
              STEPS="${{ github.event.inputs.steps }}"
              LANE="${{ github.event.inputs.lane }}"
              ;;
            schedule)
              # Nightly 3D sweep: 11 formats x 2 algos x 2 seeds x 2 hidden x 1 lr = 88 cells.
              # R5 canonical: real kernels only (matches FormatKind::from_str + ALGO_WHITELIST).
              # Fibonacci/Lucas seeds only (forbidden: 42-45). 3D FormatxAlgoxHidden coverage.
              # muon-cwd dropped 2026-05-14 (cpu_train.rs lacks impl) - see #146.
              FORMATS="fp32,gf16,bf16,fp16,fp8_e4m3,fp8_e5m2,int8,int4,nf4,posit16,fp80"
              ALGOS="adamw,muon"
              SEEDS="1597,2584"
              HIDDEN="128,256"
              LR="0.001"
              STEPS="3000"
              LANE="SHORT-WAVE-MATRIX"
              ;;
            *)
              # PR smoke: 3 formats x 2 algos x 1 seed x 1 hidden = 6 cells, short steps.
              # Use canonical real kernels + ALGO_WHITELIST so smoke tests are R5-clean.
              FORMATS="fp32,gf16,fp16"
              ALGOS="adamw,muon"
              SEEDS="1597"
              HIDDEN="128"
              LR="0.001"
              STEPS="500"
              LANE="MATRIX"
              ;;
          esac
          # R5 canonical: always include fp32+adamw baseline for anti-fake-pass guard.
          case ",$FORMATS," in *",fp32,"*|*",f32,"*) ;; *) FORMATS="fp32,$FORMATS" ;; esac
          case ",$ALGOS," in *",adamw,"*) ;; *) ALGOS="adamw,$ALGOS" ;; esac
          python3 - <<PY
          import json, os
          # R5: legacy 'f32' alias normalised to canonical 'fp32' (matches matrix_runner::normalize_format).
          formats = [(x if x != "f32" else "fp32") for x in "$FORMATS".split(",") if x]
          algos   = [x for x in "$ALGOS".split(",") if x]
          seeds   = [int(x) for x in "$SEEDS".split(",") if x]
          hiddens = [int(x) for x in "$HIDDEN".split(",") if x]
          lrs     = [float(x) for x in "$LR".split(",") if x]
          steps   = int("$STEPS")
          lane    = "$LANE".strip() or "MATRIX"
          # Forbidden seeds guard - matches matrix_runner SEED_CANON.
          FORBIDDEN = {42, 43, 44, 45}
          seeds = [s for s in seeds if s not in FORBIDDEN]
          # Algo whitelist guard - matches matrix_runner ALGO_WHITELIST.
          # muon-cwd intentionally absent (2026-05-14 hotfix, follow-up #146).
          ALGO_WHITELIST = {"adamw", "muon"}
          algos = [a for a in algos if a in ALGO_WHITELIST]
          cells = []
          for fmt in formats:
              for algo in algos:
                  for seed in seeds:
                      for hid in hiddens:
                          for lr in lrs:
                              cells.append({
                                  "format": fmt,
                                  "algo":   algo,
                                  "seed":   seed,
                                  "hidden": hid,
                                  "lr":     lr,
                                  "steps":  steps,
                                  "lane":   lane,
                              })
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("cells=" + json.dumps(cells) + "\n")
          print(f"Planned {len(cells)} cells")
          PY

  cell:
    name: ${{ matrix.cell.format }}x${{ matrix.cell.algo }} seed=${{ matrix.cell.seed }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cell: ${{ fromJson(needs.plan.outputs.cells) }}
    env:
      # Phase C workaround DSN for trios-railway#62: Railway phd-postgres-ssot
      # proxy endpoint. Stored as a repo secret; absent DSN is a no-op (R5
      # non-blocking) so PR smoke runs without touching the SSOT.
      MATRIX_DATABASE_URL: ${{ secrets.MATRIX_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Materialize pinned corpus (fail loudly if absent)
        shell: bash
        run: |
          set -euo pipefail
          # data/tiny_shakespeare.txt and data/tiny_shakespeare_val.txt are NOT
          # committed (`git ls-files data/` ships only the two .bin fixtures),
          # so on a fresh checkout the trainer has no corpus. Until 2026-08-03
          # cpu_train answered that by substituting a 52-byte string and
          # continuing, which is why the committed nightly evidence is a bpb
          # set clustered on log2(128) = 7.0 exactly.
          #
          # The corpus is provisioned HERE, by checksum, and its absence fails
          # the job. The trainer no longer gets a vote.
          mkdir -p data
          if [ ! -s data/tiny_shakespeare.txt ] || [ ! -s data/tiny_shakespeare_val.txt ]; then
            curl -sSL --retry 3 --fail \
              https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt \
              -o data/full.txt
            echo "86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed  data/full.txt" \
              | sha256sum -c -
            SIZE=$(wc -c < data/full.txt)
            head -c $((SIZE - 100000)) data/full.txt > data/tiny_shakespeare.txt
            tail -c 100000            data/full.txt > data/tiny_shakespeare_val.txt
            rm -f data/full.txt
          fi
          # Verify unconditionally: a cached or pre-existing file must be the
          # same bytes every reported BPB in this repo was measured against.
          sha256sum -c - <<'EOF'
          1a5aead1db78653f48ee799c4145ef71265f6aadd2c79ebffc9f0260cac1fb0d  data/tiny_shakespeare.txt
          2088af36b1c7831083ef22c0f6e1999b1dece15b9fbe2d4695364e95d497d502  data/tiny_shakespeare_val.txt
          EOF
          echo "[corpus] train=$(wc -c < data/tiny_shakespeare.txt) bytes  val=$(wc -c < data/tiny_shakespeare_val.txt) bytes"

      - name: Build matrix_runner
        run: cargo build --release --bin matrix_runner --bin cpu_train

      - name: Run cell
        id: run
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ./target/release/matrix_runner \
            --format=${{ matrix.cell.format }} \
            --algo=${{ matrix.cell.algo }} \
            --seed=${{ matrix.cell.seed }} \
            --hidden=${{ matrix.cell.hidden }} \
            --lr=${{ matrix.cell.lr }} \
            --lane=${{ matrix.cell.lane }} \
            --steps=${{ matrix.cell.steps }} \
            --vocab=128 --seq=32 \
            2>&1 | tee cell.log
          grep "^MATRIX_ROW " cell.log | tail -1 \
            | sed 's/^MATRIX_ROW //' > cell.json
          cat cell.json

      - name: Upload cell artefact
        uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.cell.format }}-${{ matrix.cell.algo }}-seed${{ matrix.cell.seed }}-h${{ matrix.cell.hidden }}
          path: |
            cell.json
            cell.log
            .trinity/results/*.json

  anti-fake-pass:
    name: Anti-fake-pass guard (|dbpb| >= 1e-6)
    needs: cell
    if: ${{ always() && needs.cell.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      # PR smoke runs at steps=500 which is BELOW the honest FakeQuant
      # divergence window (see gHashTag/trios#446 Sec.Anti-fake-pass rationale):
      # at <=500 steps many quantizers are still in their linear regime and
      # legitimately produce bitwise-identical bpb to f32. The guard is
      # advisory on pull_request; mandatory on schedule / workflow_dispatch
      # where cells run at steps>=3000.
      ADVISORY: ${{ github.event_name == 'pull_request' }}
      MIN_STEPS_FOR_GUARD: "1000"
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Verify every non-baseline cell diverges from fp32+adamw
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          # ------------------------------------------------------------------
          # PER-CELL GUARD RESTORED (2026-08-03).
          #
          # The previous version passed if AT LEAST ONE non-baseline cell
          # diverged by >= 1e-6. That is a guard over the whole matrix, not
          # over any cell in it: 87 of 88 cells could be a silent F32 fallback
          # and the job would still report OK. Worse, it was evaluated over
          # numbers that were measured on a 52-byte substitute corpus, because
          # cpu_train pointed at data/tinyshakespeare.txt (no underscore) and
          # invented a fallback when it was missing - the committed evidence is
          # a bpb set clustered on log2(128) = 7.0 exactly.
          #
          # The corpus is now provisioned by checksum in the `cell` job and the
          # trainer refuses to fabricate one, so these numbers are measurements
          # again and the strict guard is meaningful again. Every eligible
          # non-baseline cell must diverge from its own (hidden, seed)
          # baseline. A cell that legitimately ties is a finding to be recorded
          # in the ledger, not a condition for the guard to relax itself.
          #
          # The "empirical 20-cell sweep evidence" cited by the downgrade is
          # not reproducible from this repository: it was collected against the
          # substitute corpus. It is therefore not treated as evidence here.
          # ------------------------------------------------------------------
          artefacts = pathlib.Path("artefacts")
          rows = []
          unparseable = []
          for p in artefacts.rglob("cell.json"):
              try:
                  rows.append(json.loads(p.read_text()))
              except Exception as e:
                  unparseable.append((p, e))
                  print(f"ERROR: cannot parse {p}: {e}", file=sys.stderr)
          advisory  = os.environ.get("ADVISORY", "false") == "true"
          min_steps = int(os.environ.get("MIN_STEPS_FOR_GUARD", "1000"))
          failures = []
          if unparseable:
              failures.append(f"{len(unparseable)} cell.json artefact(s) unparseable")
          if not rows:
              # An empty artefact set used to exit 0 with "guard skipped (not a
              # failure)". The cell job ran; producing no parseable row IS the
              # failure.
              failures.append("NO CELLS COLLECTED: zero parseable cell.json artefacts")
          # A row whose executed format is not the format it is filed under is
          # a mislabelled measurement regardless of any bpb comparison.
          for r in rows:
              fx = r.get("format_executed", "")
              if not fx:
                  failures.append(
                      f"cell {r.get('canon_name','?')} carries no format_executed "
                      "(trainer too old to declare what it ran)")
          # Build baseline index: (hidden, seed) -> bpb at f32+adamw.
          baseline = {}
          for r in rows:
              if r["format"] in ("fp32", "f32") and r["algo"] == "adamw":
                  baseline[(r["hidden"], r["seed"])] = r["bpb"]
          eligible = [r for r in rows
                      if r["step"] >= min_steps
                      and not (r["format"] in ("fp32", "f32") and r["algo"] == "adamw")]
          if rows and not baseline:
              failures.append(
                  "no fp32+adamw baseline cell in the matrix: nothing to compare "
                  "against, so no cell can be certified")
          offenders = []
          unpaired = []
          EPS = 1e-6
          for r in eligible:
              ref = baseline.get((r["hidden"], r["seed"]))
              if ref is None:
                  unpaired.append(r)
                  continue
              delta = abs(r["bpb"] - ref)
              print(f"cell {r['format']:>10} x {r['algo']:>12} "
                    f"seed={r['seed']} h={r['hidden']} step={r['step']} "
                    f"bpb={r['bpb']:.6f} |dbpb|={delta:.6e}")
              if delta < EPS:
                  offenders.append((r, ref, delta))
          if offenders:
              print(f"\nFAKE-PASS: {len(offenders)} of {len(eligible)} eligible cell(s) "
                    f"are bit-identical to fp32+adamw (|dbpb| < {EPS}, step >= {min_steps}). "
                    "The kernel under test did not change the computation:",
                    file=sys.stderr)
              for r, ref, delta in offenders:
                  print(f"  {r['format']}x{r['algo']} seed={r['seed']} "
                        f"h={r['hidden']} step={r['step']} "
                        f"bpb={r['bpb']} ref={ref} |d|={delta}", file=sys.stderr)
              failures.append(f"{len(offenders)} cell(s) failed the per-cell divergence guard")
          if unpaired:
              print(f"\nWARN: {len(unpaired)} eligible cell(s) have no "
                    "(hidden, seed) baseline and were not checked:")
              for r in unpaired:
                  print(f"  {r['format']}x{r['algo']} seed={r['seed']} h={r['hidden']}")
              failures.append(f"{len(unpaired)} eligible cell(s) had no baseline to compare against")
          if not eligible and rows:
              print(f"\nNo eligible cells (step >= {min_steps}); nothing was certified.")
          if failures:
              print("\nANTI-FAKE-PASS FAILED:", file=sys.stderr)
              for f in failures:
                  print(f"  - {f}", file=sys.stderr)
              if advisory:
                  print("\nADVISORY mode (pull_request): reported, not enforced. "
                        "PR smoke runs at steps=500, below MIN_STEPS_FOR_GUARD, so "
                        "most cells are not eligible in the first place.")
                  sys.exit(0)
              sys.exit(1)
          print(f"\nAnti-fake-pass OK: all {len(eligible)} eligible cell(s) diverge "
                f"from their fp32+adamw baseline by >= {EPS} "
                f"(min_steps={min_steps}, advisory={advisory}).")
          PY

  collect-ledger:
    name: Collect ledger (L-MATRIX-LEDGER - trios#380)
    needs: [cell, anti-fake-pass]
    # Run on schedule + manual dispatch only - the PR smoke matrix has too few
    # cells to be worth a ledger refresh PR (and would spam main).
    #
    # The anti-fake-pass result is now part of the gate. It was previously
    # ignored (`always() && needs.cell.result == 'success'`), so a matrix that
    # failed the divergence guard still refreshed the live ledger.
    if: ${{ needs.cell.result == 'success' && needs.anti-fake-pass.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Build matrix_ledger collector
        shell: bash
        run: cargo build --release --bin matrix_ledger

      - name: Collect per-cell artefacts -> assertions/matrix_samples.jsonl
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA:    ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p assertions
          ./target/release/matrix_ledger collect \
            --artefact-root artefacts \
            --out assertions/matrix_samples.jsonl \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
          echo "----- ledger first 3 rows -----"
          head -3 assertions/matrix_samples.jsonl || true
          echo "----- total -----"
          wc -l assertions/matrix_samples.jsonl

      - name: Open ledger refresh PR
        # No-op when there's nothing to commit (matrix re-ran with identical
        # cells). Branch name is keyed by run_id so concurrent sweeps don't
        # collide.
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The ledger file lives under /assertions/ which is .gitignored,
          # so `git status --porcelain` returns empty even when the file
          # is freshly written. We detect changes by hashing the new file
          # and comparing against the blob hash on HEAD. Empty file or
          # unchanged content -> skip; everything else -> open PR.
          if [[ ! -s assertions/matrix_samples.jsonl ]]; then
            echo "[matrix_ledger] empty ledger file - skipping PR"
            exit 0
          fi
          NEW_HASH=$(git hash-object assertions/matrix_samples.jsonl)
          OLD_HASH=$(git rev-parse "HEAD:assertions/matrix_samples.jsonl" 2>/dev/null || echo "")
          if [[ -n "$OLD_HASH" && "$NEW_HASH" == "$OLD_HASH" ]]; then
            echo "[matrix_ledger] content identical to main - skipping PR"
            exit 0
          fi
          BRANCH="auto/matrix-ledger-${GITHUB_RUN_ID}"
          git config user.name  "trios-matrix-ledger-bot"
          git config user.email "matrix-ledger-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -f assertions/matrix_samples.jsonl
          ROWS=$(wc -l < assertions/matrix_samples.jsonl)
          HITS=$(grep -c '"falsifier_2_hit":true' assertions/matrix_samples.jsonl || true)
          git commit -m "chore(matrix-ledger): refresh assertions/matrix_samples.jsonl

          Auto-PR from format-algo-matrix workflow run ${GITHUB_RUN_ID}.

          rows=${ROWS} falsifier_2_hits=${HITS} commit_sha=${GITHUB_SHA}

          R4 trace block: assertions/igla_assertions.json::matrix_ledger
          R7 witness   : appendix/L-pollen-channel.tex Sec.matrix-ledger
          refs trios#380 trios#446 trios#536

          [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(matrix-ledger): refresh assertions/matrix_samples.jsonl (run ${GITHUB_RUN_ID})" \
            --body  "Auto-PR from L-MATRIX-LEDGER (lane queen-order trios#380).
          
          - **rows**: ${ROWS}
          - **falsifier_2 hits**: ${HITS}
          - **commit_sha**: ${GITHUB_SHA}
          - **workflow run**: https://github.com/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}
          
          Anchor: \`phi^2 + phi^-2 = 3\`
          
          [skip ci]" \
            --base main \
            --head "$BRANCH"
