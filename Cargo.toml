[workspace]
# Workspace includes the migration subcrate (sea-orm-migration)
members = [".", "migration"]
# Empty resolver comment preserved for compatibility

[package]
name        = "trios-trainer"
version     = "0.1.0"
edition     = "2021"
autobins    = false
authors     = ["Dmitrii Vasilev <gierenmumindvy1t@hotmail.com>"]
license     = "MIT"
description = "Single source of truth for IGLA RACE training (gHashTag/trios#143). Portable Rust-only pipeline that runs on any CPU machine, Railway, Fly, or Docker. Anchor: phi^2 + phi^-2 = 3."
repository  = "https://github.com/gHashTag/trios-trainer-igla"
homepage    = "https://github.com/gHashTag/trios-trainer-igla"
readme      = "README.md"
keywords    = ["machine-learning", "training", "transformer", "jepa", "trios"]
categories  = ["science", "command-line-utilities"]

[lib]
name = "trios_trainer"
path = "src/lib.rs"

# QUARANTINE PASS, 2026-08-03. Seven files under src/bin/ were git-tracked with
# their [[bin]] stanzas commented out: train_cpu.rs, transformer_train.rs,
# trinity_3k_fineweb_train.rs, trinity_3k_simple_train.rs,
# trinity_3k_tinyshakespeare.rs, trinity_tournament.rs, lr_calibration.rs. A
# commented-out stanza declares nothing and `autobins = false` means cargo
# discovers nothing, so no compiler had ever read them and no #[test] inside
# them could ever fail - while a reader cloning the repo saw them sitting in
# src/ next to live code. All seven are now in attic/, each with the reason it
# never compiled recorded at the stanza it used to occupy.
#
# Moved with them: src/bin/tjepa_modules/ (mod.rs, encoder.rs, ntp.rs). That
# directory looked like a module tree of src/bin/tjepa_train.rs, which is a
# LIVE binary - but tjepa_train.rs declares no `mod tjepa_modules` and nothing
# else in src/, tests/ or this manifest referenced the name. It compiled under
# no target at all. tjepa_train.rs itself is untouched and still declared below.
#
# `every_tracked_bin_source_is_a_declared_bin` in
# tests/ledger_exit_code_binaries.rs fails if a file is ever tracked under
# src/bin/ again without a live [[bin]] stanza.

[[bin]]
name = "entrypoint"
path = "src/bin/entrypoint.rs"

[[bin]]
name = "trios-train"
path = "src/bin/trios-train.rs"

# Auditor-side spot-check verifier. Re-executes `trios-train` as a SUBPROCESS
# and re-derives one checkpoint from its own sidecar, so a reproducibility claim
# can be falsified by someone who has only the binary, the corpus and the JSON.
# Returns VERIFIED / MISMATCH / INCOMPARABLE (a schema/1 record cannot state its
# own `eval_every` and is therefore ungradable). See src/bin/ckpt_replay.rs and
# docs/REPRODUCIBILITY-GRADING.md.
[[bin]]
name = "ckpt_replay"
path = "src/bin/ckpt_replay.rs"

[[bin]]
name = "railway-sweep"
path = "src/bin/railway_sweep.rs"

[[bin]]
name = "trios-igla"
path = "src/bin/trios-igla.rs"

[[bin]]
name = "hybrid_train"
path = "src/bin/hybrid_train.rs"

[[bin]]
name = "seed_emit"
path = "src/bin/seed_emit.rs"

[[bin]]
name = "ledger_check"
path = "src/bin/ledger_check.rs"

[[bin]]
name = "qk_gain_check"
path = "src/bin/qk_gain_check.rs"

[[bin]]
name = "honey_audit"
path = "src/bin/honey_audit.rs"

[[bin]]
name = "cpu_train"
path = "src/bin/cpu_train.rs"

# Concatenated-context MLP char model. Self-contained: it depends on no module
# that lives in attic/. Declared 2026-08-03 -- it had been git-tracked and
# undeclared, which meant its round-1 hardening (`loss_on_seq`/`evaluate`
# returning `Option` instead of the 0.0 and `f32::MAX` sentinels, and the
# removal of the `probs[target].max(1e-10)` NaN launder) and the regression test
# that guards its corpus refusal had never once been compiled. A fix no compiler
# reads is a fix nobody has.
[[bin]]
name = "concat_train"
path = "src/bin/concat_train.rs"

# `igla_train` was removed 2026-08-02. It read a hardcoded corpus path that
# misspelled the file in `data/` and so had never existed in this repo, it
# silently substituted a 52-byte string, then called
# `evaluate(&model, &tokens, SEQ)` on the very slice it had trained on. The
# resulting BPB=2.5648 from memorising 52 bytes sat within 0.05 of the crate's
# own BPB_CHAMPION, and `CANON_NAME` came from the environment, so it routed
# straight into ssot.bpb_samples. Nothing referenced it: not the Dockerfile, not
# `entrypoint.rs`'s TRIOS_TRAINER_BIN whitelist. Deleted with its source.

[[bin]]
name = "ngram_train"
path = "src/bin/ngram_train.rs"

[[bin]]
name = "ngram_train_gf16"
path = "src/bin/ngram_train_gf16.rs"

# MOVED to attic/train_cpu.rs on 2026-08-03. It needed the `bench` / `backward`
# modules, unbuilt files already in attic/, so this stanza could never have been
# uncommented as written. See attic/README.md before reviving it.

[[bin]]
name = "train_v2"
path = "src/bin/train_v2.rs"

# Smoke proof binary -- minimal end-to-end pipeline test, runs in <60s on CPU
# with synthetic data and writes one bpb_samples row. See src/bin/smoke_train.rs.
[[bin]]
name = "smoke_train"
path = "src/bin/smoke_train.rs"

# Scarab Worker -- fungible-pool claim loop. One image, N replicas.
# See src/bin/scarab.rs and docs/SCARAB_WORKER.md.
[[bin]]
name = "scarab"
path = "src/bin/scarab.rs"

# MOVED to attic/transformer_train.rs on 2026-08-03. It needed the
# `transformer_trainer` module, an unbuilt file already in attic/ that prints a
# fabricated "IMPROVEMENT" number. See attic/README.md.

# MOVED to attic/ on 2026-08-03: trinity_3k_fineweb_train.rs,
# trinity_3k_simple_train.rs, trinity_3k_tinyshakespeare.rs. All three needed the
# `trinity_3k` module, an unbuilt file already in attic/. See attic/README.md.

# Temporary test bins removed after run

[[bin]]
name = "trinity_pr1722"
path = "src/bin/trinity_pr1722.rs"

# MOVED to attic/trinity_tournament.rs on 2026-08-03. It needed the `backward` /
# `bench` / `swa_phi` modules, unbuilt files already in attic/. See
# attic/README.md.

[[bin]]
name = "arch_explorer"
path = "src/bin/arch_explorer.rs"

# MOVED to attic/attn_train.rs on 2026-08-03. It needed `trios_trainer::attention`,
# an unbuilt file already in attic/, so the commented-out stanza below could never
# be uncommented as written -- and being commented out is what let its `evaluate`
# keep returning `f32::MAX` from both barren paths, seeding `best_val_bpb` and
# printing `BPB=340282346638528859811704183484516925440.0000` directly above
# `vs champion 2.5193`. A tracked file that no compiler ever reads cannot be
# hardened, only believed. See attic/README.md before reviving it.
#
# MOVED to attic/bench_cpu.rs on 2026-08-03. Needed `trios_trainer::bench`, also
# already in attic/, and its output is emoji-decorated (violates ASCII-only).
#
# MOVED to attic/ptq_eval.rs on 2026-08-03. It imported `trios_trainer_igla::*`,
# a crate name that does not exist in this workspace (the lib is `trios_trainer`),
# so it had never compiled; its body ends at
# "TODO: implement model loading and BPB measurement" -- it quantizes nothing and
# measures nothing.

[[bin]]
name = "gf16_test"
path = "src/bin/gf16_test.rs"

[[bin]]
name = "igla_trigram"
path = "src/bin/igla_trigram.rs"

# MOVED to attic/lr_calibration.rs on 2026-08-03. It imported the
# `trios_phi_schedule` crate, which is not a dependency of this workspace, so it
# had never compiled. See attic/README.md before reviving it.

[[bin]]
name = "lstm_train"
path = "src/bin/lstm_train.rs"

[[bin]]
name = "r12_optimizer_race"
path = "src/bin/r12_optimizer_race.rs"

[[bin]]
name = "tjepa_train"
path = "src/bin/tjepa_train.rs"

[[bin]]
name = "tri"
path = "src/bin/tri.rs"

# F2 breadth-as-moat harness (CPU proxy). phi-ladder vs heterogeneous zoo over
# multiple seeds with a Welch two-sample read + lossy-conversion accounting.
# Refs: gHashTag/t27#1021 (real BPB head-to-head, BLOCKED on compute); FL-002.
[[bin]]
name = "f2_harness"
path = "src/bin/f2_harness.rs"

[features]
# Default builds standalone with internal stub modules. No network deps required.
default = []
race = []
# Enable when running alongside the trios workspace -- pulls invariants, ASHA and
# victory gate from the canonical implementations via git.
trios-integration = []
# Enable in CI to enforce embargo + triplet validation strictly.
ci-strict = []
# Smoke-proof: minimal train that runs in <60s with synthetic data, steps=1,
# CPU-only, and writes one row to bpb_samples. Used by .github/workflows/smoke.yml
# to prove the queue -> worker -> trainer -> JSONL -> DB pipe is alive end-to-end.
# Refs: trios-trainer-igla#57, trios#445.
smoke = []
# GPU acceleration using Candle with CUDA support
gpu = ["candle-core", "candle-nn"]
# GF16 ternary matmul kernel -- compile-time gate for Wave 32.
# Build with: cargo build --features gf16
# Without this flag, GF16_ENABLED=true at runtime returns an error.
gf16 = []


[dependencies]
# GPU/ML framework for CUDA support
candle-core = { version = "0.7", features = ["cuda"], optional = true }
candle-nn   = { version = "0.7", features = ["cuda"], optional = true }

# Standard[dependencies]
# Internal canonical crates (opt-in via `trios-integration` feature).
# Temporarily disabled due to submodule issue -- use local path or fix submodule.
# trios-igla-race        = { git = "https://github.com/gHashTag/trios.git", branch = "main", optional = true }
# trios-precision-router = { git = "https://github.com/gHashTag/trios.git", branch = "main", optional = true }
# trios-phi-schedule     = { git = "https://github.com/gHashTag/trios.git", branch = "main", optional = true }
# trios-golden-float     = { git = "https://github.com/gHashTag/trios.git", branch = "main", optional = true }

# Standard
anyhow             = "1.0"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
toml               = "0.8"
# Pin to version compatible with Rust 1.82 (clap_lex 1.0.0 doesn't require edition2024)
clap               = { version = "=4.5.4", features = ["derive", "env"] }
chrono             = { version = "0.4", features = ["serde"] }
rand               = "0.8"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha1               = "0.10"
# EPIC-446: content-addressing for checkpoint artifacts. Resolves to 0.10.9,
# already present in Cargo.lock as a sea-orm/sqlx transitive, so promoting it
# to a direct dependency adds no new crate to the build graph.
sha2               = "0.10"
uuid               = { version = "1", features = ["v4"] }
tokio              = { version = "1", features = ["full"] }
tokio-postgres       = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.12"
rustls               = "0.23"
webpki-roots         = "0.26"
ureq                  = "2.12"
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = "1.1"
migration = { path = "migration" }

[dev-dependencies]
tempfile = "3.10"

# Clippy debt living on `main` since before integration PR #32. Allow-listed at
# the package level so CI stays green while we focus on Gate-2 (deadline
# 2026-04-30 23:59 UTC). Each lint will be paid down in a dedicated
# technical-debt PR after merge. R5-honest: NOT introduced by PR #32.
[lints.rust]
dead_code = "allow"
unexpected_cfgs = "allow"
unused_imports = "allow"
unused_parens = "allow"
unused_variables = "allow"
unused_mut = "allow"

[lints.clippy]
approx_constant = "allow"
assertions_on_constants = "allow"
clone_on_copy = "allow"
collapsible_if = "allow"
derivable_impls = "allow"
excessive_precision = "allow"
field_reassign_with_default = "allow"
float_cmp = "allow"
if_same_then_else = "allow"
let_and_return = "allow"
manual_clamp = "allow"
manual_memcpy = "allow"
manual_range_contains = "allow"
module_inception = "allow"
needless_borrow = "allow"
needless_pass_by_value = "allow"
needless_range_loop = "allow"
needless_return = "allow"
neg_cmp_op_on_partial_ord = "allow"
ptr_arg = "allow"
redundant_clone = "allow"
redundant_closure = "allow"
redundant_field_names = "allow"
should_implement_trait = "allow"
single_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_cast = "allow"
useless_conversion = "allow"
useless_vec = "allow"

[[bin]]
name = "bpb_smoke"
path = "src/bin/bpb_smoke.rs"

[[bin]]
name = "matrix_runner"
path = "src/bin/matrix_runner.rs"

[[bin]]
name = "matrix_ledger"
path = "src/bin/matrix_ledger.rs"


[[bin]]
name = "format_champion_sweep"
path = "src/bin/format_champion_sweep.rs"

# Per-primitive cross-architecture arithmetic probe. Runs each floating-point
# primitive of the training path ALONE -- sequential dot, split-accumulator
# dot, exp/ln/sqrt/powf/cos, squared ReLU, softmax, layer_norm, the `proj`
# matvec and one full forward pass -- and hashes the raw little-endian f32
# output bytes, so the cross-architecture divergence can be attributed to
# reduction order or to libm instead of merely localised. No randomness, no
# file I/O, no environment reads. See src/bin/xarch_probe.rs and
# docs/DIVERGENCE-MECHANISM.md.
[[bin]]
name = "xarch_probe"
path = "src/bin/xarch_probe.rs"

# Element-wise companion to xarch_probe. The probe hashes each primitive whole,
# which names the mechanism and cannot size it; this one prints the raw u32 bit
# pattern of all 4096 results of exp/ln/sqrt/powf/cos, so the "every
# disagreement is exactly 1 ULP" table in docs/DIVERGENCE-MECHANISM.md is
# derived from a committed artifact rather than from a program that used to
# live in /tmp. Same LCG, same seeds, same ranges as the probe, so its DIGEST
# lines must equal the probe's PRIMITIVE hashes on the same arm --
# tests/xarch_probe_census.rs asserts that join. No arguments, no randomness,
# no file I/O, no environment reads.
[[bin]]
name = "ulp_census"
path = "src/bin/ulp_census.rs"

# Raw vs canonical checkpoint digest. The reproducibility criterion is sha256
# over the raw bytes, and that digest distinguishes -0.0 from +0.0 while IEEE
# 754 and every forward pass in the trainer do not -- so it can report MISMATCH
# between two numerically identical artifacts. This binary measures how much of
# a mismatch is that encoding artefact (2 073 of 95 144 parameters on the
# published cross-architecture pair) and how much is real. See
# src/canonical_digest.rs and docs/CANONICAL-SERIALIZATION.md.
[[bin]]
name = "canon_digest"
path = "src/bin/canon_digest.rs"
